<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FR Premium Store</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f7fb;font-family:Arial,sans-serif}nav{padding:18px 5%;border-bottom:1px solid #20334c;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:55px 20px}.muted{color:#9fb0c5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#0e1b2d;border:1px solid #20334c;border-radius:16px;padding:22px}.btn{background:#7167ff;color:white;border:0;padding:11px 16px;border-radius:9px;cursor:pointer}input{width:100%;padding:11px;margin:7px 0 13px;background:#081321;border:1px solid #29405d;border-radius:8px;color:white}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.modal>div{width:min(480px,100%);background:#0e1b2d;padding:25px;border-radius:16px}.price{font-size:28px;font-weight:800}@media(max-width:750px){.grid{grid-template-columns:1fr}}
</style></head><body><nav><b>FR <span style="color:#8c86ff">Premium Store</span></b><button class="btn" onclick="openLookup()">Check Order</button></nav><main class="wrap"><h1>Premium subscriptions, simple ordering.</h1><p class="muted">Choose a plan and place your order.</p><div id="products" class="grid"></div></main>
<div id="order" class="modal"><div><h2>Place Order</h2><input type="hidden" id="pid"><input id="name" placeholder="Your name"><input id="phone" placeholder="Phone / WhatsApp"><select id="method"><option value="">Select payment method</option><option>bKash</option><option>Nagad</option></select>
<input id="pay" placeholder="Transaction ID / payment reference">
<div style="background:#081321;border:1px solid #29405d;padding:12px;border-radius:8px;margin:8px 0 14px">
<b>Payment numbers</b><br>bKash: 01897907975<br>Nagad: 01867015280
</div>
<button class="btn" onclick="place()">Submit Order</button> <button class="btn" style="background:#25354d" onclick="closeM('order')">Close</button></div></div>
<div id="lookup" class="modal"><div><h2>Order Status</h2><input id="code" placeholder="Order ID"><button class="btn" onclick="lookup()">Check</button><div id="result"></div><br><button class="btn" style="background:#25354d" onclick="closeM('lookup')">Close</button></div></div>
<script>
async function load(){let r=await fetch('/api/products'),ps=await r.json();products.innerHTML=ps.map(p=>`<div class="card"><small>${p.duration}</small><h2>${p.name}</h2><p class="muted">${p.description||''}</p><div class="price">৳${p.price}</div><button class="btn" onclick="openOrder(${p.id})">Buy Now</button></div>`).join('')}
function openOrder(id){pid.value=id;order.style.display='flex'}function openLookup(){lookup.style.display='flex'}function closeM(id){document.getElementById(id).style.display='none'}
async function place(){let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:+pid.value,name:name.value,phone:phone.value,paymentMethod:method.value,paymentRef:pay.value})});let x=await r.json();if(!r.ok)return alert(x.error);closeM('order');alert('Order submitted. ID: '+x.orderCode)}
async function lookup(){let r=await fetch('/api/orders/'+encodeURIComponent(code.value));let x=await r.json();result.innerHTML=r.ok?`<p>Order: <b>${x.order_code}</b></p><p>${x.product_name}</p><p>Status: <b>${x.status}</b></p>`:`<p>${x.error}</p>`}load();
</script></body></html>
